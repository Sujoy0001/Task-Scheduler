[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-scheduler"
version = "0.1.0"
description = "Task scheduler with FastAPI web UI"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
py-modules = ["main", "cli", "job", "persistence", "registry", "retry", "tasks", "worker"]

[tool.pytest.ini_options]
pythonpath = "."
