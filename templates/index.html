<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Scheduler</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      }
      .card {
        box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
        border: none;
        border-radius: 1rem;
      }
      .status-badge {
        min-width: 110px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row mb-4">
        <div class="col">
          <h1 class="display-5 fw-bold">Task Scheduler</h1>
          <p class="text-muted">
            Monitor queued jobs, submit new tasks, and track execution status.
          </p>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card p-4 h-100">
            <h3 class="h5 mb-3">Submit a Job</h3>
            <form id="jobForm">
              <div class="mb-3">
                <label for="taskName" class="form-label">Task</label>
                <select id="taskName" class="form-select" required>
                  <option value="send_email">send_email</option>
                  <option value="resize_image">resize_image</option>
                  <option value="flaky_task">flaky_task</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="taskArgs" class="form-label"
                  >Arguments (JSON)</label
                >
                <textarea id="taskArgs" class="form-control" rows="4">
{"to":"user@example.com","subject":"Welcome"}</textarea
                >
              </div>

              <div class="mb-3">
                <label for="taskKwargs" class="form-label"
                  >Keyword Args (JSON)</label
                >
                <textarea id="taskKwargs" class="form-control" rows="4">
{"to":"user@example.com","subject":"Welcome"}</textarea
                >
              </div>

              <button class="btn btn-primary w-100" type="submit">
                Submit Job
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3 class="h5 mb-0">Jobs</h3>
              <div class="d-flex gap-2">
                <button id="workerBtn" class="btn btn-success btn-sm">
                  Start Worker
                </button>
                <button
                  id="refreshBtn"
                  class="btn btn-outline-secondary btn-sm"
                >
                  Refresh
                </button>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Task</th>
                    <th>Status</th>
                    <th>Attempts</th>
                    <th>Created</th>
                  </tr>
                </thead>
                <tbody id="jobTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const jobTableBody = document.getElementById("jobTableBody");
      const refreshBtn = document.getElementById("refreshBtn");
      const workerBtn = document.getElementById("workerBtn");
      const jobForm = document.getElementById("jobForm");

      function getStatusClass(status) {
        const map = {
          pending: "bg-warning text-dark",
          running: "bg-primary",
          success: "bg-success",
          failed: "bg-danger",
        };
        return map[status] || "bg-secondary";
      }

      function renderJobs(jobs) {
        if (!jobs.length) {
          jobTableBody.innerHTML =
            '<tr><td colspan="5" class="text-center text-muted">No jobs yet</td></tr>';
          return;
        }

        jobTableBody.innerHTML = jobs
          .map(
            (job) => `
          <tr>
            <td><code>${job.id}</code></td>
            <td>${job.task}</td>
            <td><span class="badge status-badge ${getStatusClass(job.status)}">${job.status}</span></td>
            <td>${job.attempts}/${job.max_attempts}</td>
            <td>${new Date(job.created_at).toLocaleString()}</td>
          </tr>
        `,
          )
          .join("");
      }

      async function loadJobs() {
        const response = await fetch("/api/jobs");
        const jobs = await response.json();
        renderJobs(jobs);
      }

      jobForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const task = document.getElementById("taskName").value;
        const argsText = document.getElementById("taskArgs").value.trim();
        const kwargsText = document.getElementById("taskKwargs").value.trim();

        let args = [];
        let kwargs = {};

        try {
          args = argsText ? JSON.parse(argsText) : [];
          kwargs = kwargsText ? JSON.parse(kwargsText) : {};
        } catch (error) {
          alert("Please enter valid JSON for the arguments fields.");
          return;
        }

        const response = await fetch("/api/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task, args, kwargs }),
        });

        const result = await response.json();
        if (!response.ok) {
          alert(result.detail || "Could not submit job");
          return;
        }

        jobForm.reset();
        document.getElementById("taskArgs").value =
          '{"to":"user@example.com","subject":"Welcome"}';
        document.getElementById("taskKwargs").value =
          '{"to":"user@example.com","subject":"Welcome"}';
        await loadJobs();
      });

      async function startWorker() {
        workerBtn.disabled = true;
        workerBtn.textContent = "Starting...";

        try {
          const response = await fetch("/api/worker/start", { method: "POST" });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.detail || "Unable to start worker");
          }
          alert(
            result.status === "already_running"
              ? "Worker is already running."
              : "Worker started successfully.",
          );
        } catch (error) {
          alert(error.message || "Could not start worker");
        } finally {
          workerBtn.disabled = false;
          workerBtn.textContent = "Start Worker";
        }
      }

      refreshBtn.addEventListener("click", loadJobs);
      workerBtn.addEventListener("click", startWorker);
      loadJobs();
      setInterval(loadJobs, 5000);
    </script>
  </body>
</html>
